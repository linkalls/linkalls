# プロフィールREADMEのSVG画像を毎日更新する。
# 通常の閲覧時は外部画像生成サーバーに依存せず、リポジトリ内のファイルを表示する。
name: Update GitHub profile cards

on:
  # UTC 03:17 = 日本時間 12:17。毎日1回自動更新する。
  schedule:
    - cron: "17 3 * * *"

  # Actionsタブから手動でも再生成できる。
  workflow_dispatch:

  # READMEを切り替えた直後に初回生成する。
  # SVGだけの更新では再実行しないため、無限ループにならない。
  push:
    branches:
      - main
    paths:
      - README.md

# SVGをリポジトリへ保存するために必要な最小権限。
permissions:
  contents: write

# 同時に実行されてもpushの競合を避ける。
concurrency:
  group: github-profile-cards
  cancel-in-progress: false

jobs:
  update-cards:
    name: Generate and commit profile SVG cards
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      # Stats: API取得に失敗した場合はエラー画像を保存しない。
      - name: Generate GitHub stats
        id: stats
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=linkalls&theme=onedark&show_icons=true"
          path: profile/stats.svg
          token: ${{ github.token }}
          fail_on_error: "true"

      # Top Languagesも独立に生成する。
      - name: Generate top languages
        id: languages
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=linkalls&layout=compact&theme=onedark"
          path: profile/top-langs.svg
          token: ${{ github.token }}
          fail_on_error: "true"

      # Trophyは公開ミラーのSVGを1日1回取得してローカル保存する。
      # 個人用PATや外部の画像表示サーバーへの閲覧時アクセスは不要。
      # ミラーの候補はryo-ma/github-profile-trophyのREADMEに掲載されたもの。
      - name: Generate GitHub trophy without a PAT
        id: trophy
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          # 不完全なダウンロードを保存しないよう、一時ファイルで検査する。
          candidate="$(mktemp)"
          trap 'rm -f "$candidate"' EXIT

          mirrors=(
            'https://trophy.ryglcloud.net/?username=linkalls&theme=radical'
            'https://github-profile-trophy-fork-two.vercel.app/?username=linkalls&theme=radical'
            'https://github-profile-trophy-liard-delta.vercel.app/?username=linkalls&theme=radical'
            'https://github-profile-trophy-winning.vercel.app/?username=linkalls&theme=radical'
          )

          for url in "${mirrors[@]}"; do
            echo "Trying trophy mirror: ${url%%\?*}"

            if ! curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 --retry 2 \
              --output "$candidate" "$url"; then
              echo "::warning::Trophy mirror request failed."
              continue
            fi

            # HTMLエラーページや壊れたSVGをコミットしない。
            if python3 - "$candidate" <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          path = Path(sys.argv[1])
          try:
              svg = ET.parse(path).getroot()
          except (ET.ParseError, OSError):
              sys.exit(1)

          if svg.tag not in {"{http://www.w3.org/2000/svg}svg", "svg"}:
              sys.exit(1)
          if path.stat().st_size < 1000:
              sys.exit(1)

          # SVGの中身がエラー画面である場合も拒否する。
          svg_text = " ".join(svg.itertext()).lower()
          if any(message in svg_text for message in (
              "something went wrong",
              "resource not accessible",
              "rate limit exceeded",
              "internal server error",
          )):
              sys.exit(1)
          PY
            then
              cp "$candidate" profile/trophy.svg
              echo "Trophy SVG generated successfully."
              exit 0
            fi

            echo "::warning::Trophy mirror returned invalid SVG."
          done

          echo "::error::All trophy mirrors failed. Keeping the previous SVG."
          exit 1

      # どれかの生成に失敗したら、そのカードだけ前回の正常なSVGを残す。
      # 初回はリポジトリ内に表示可能なプレースホルダーがある。
      - name: Preserve previously generated cards on failure
        shell: bash
        env:
          STATS_OUTCOME: ${{ steps.stats.outcome }}
          LANGUAGES_OUTCOME: ${{ steps.languages.outcome }}
          TROPHY_OUTCOME: ${{ steps.trophy.outcome }}
        run: |
          set -euo pipefail

          check_card() {
            local file="$1"
            local outcome="$2"

            if [[ "$outcome" != "success" ]] ||
               ! grep -q '<svg' "$file" ||
               ! grep -q '</svg>' "$file"; then
              echo "::warning title=Profile card unchanged::Generation failed or returned invalid SVG: $file"
              git restore -- "$file"
            fi
          }

          check_card "profile/stats.svg" "$STATS_OUTCOME"
          check_card "profile/top-langs.svg" "$LANGUAGES_OUTCOME"
          check_card "profile/trophy.svg" "$TROPHY_OUTCOME"

      # GitHubの画像キャッシュを避けるため、SVGの内容ハッシュをREADMEのURLに付与する。
      # 画像の内容が変わらない日はURLも変更されない。
      - name: Refresh image cache versions in README
        run: python3 .github/scripts/update_profile_cache_versions.py

      # 成功したカードとキャッシュ更新済みREADMEをコミットする。
      - name: Commit updated cards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md profile/stats.svg profile/top-langs.svg profile/trophy.svg

          if git diff --cached --quiet; then
            echo "Profile cards and README image URLs are already up to date."
            exit 0
          fi

          git commit -m "chore: refresh GitHub profile cards [skip ci]"
          git push
